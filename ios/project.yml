name: ScanCapture
options:
  bundleIdPrefix: com.scancapture
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  ScanCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScanCapture
        excludes:
          - "**/*.md"
    info:
      path: ScanCapture/Resources/Info.plist
      properties:
        CFBundleDisplayName: ScanCapture
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "ScanCapture uses the camera to record 3D scenes with ARKit depth sensing."
        NSMicrophoneUsageDescription: "Microphone access is needed to record audio during scanning sessions."
        NSMotionUsageDescription: "Motion data enables accurate camera pose tracking for 3D reconstruction."
        NSPhotoLibraryAddUsageDescription: "Save captured 3D scan previews to your Photo Library."
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scancapture.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: ScanCapture/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          MTL_ENABLE_DEBUG_INFO: NO
          VALIDATE_PRODUCT: YES
    dependencies:
      - package: ZIPFoundation
    entitlements:
      path: ScanCapture/ScanCapture.entitlements
    scheme:
      testTargets: []
      gatherCoverageData: false
